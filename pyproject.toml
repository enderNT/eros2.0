[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agente"
version = "0.1.0"
description = "WhatsApp conversational assistant for a psychology clinic"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "freezegun",
    "ruff",
]
# Casos conversacionales de `evals/`. Van aparte porque arrastran deepeval y su
# árbol de dependencias, que no tiene nada que hacer en la imagen que se despliega.
evals = [
    "pytest",
    "pytest-asyncio",
    "deepeval>=4.1,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]
# The panel bundle is built by `panel-ui` into web/static/panel before packaging.
include = [
  "src/agente/web/static/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "lento: caso conversacional largo; muchas llamadas al modelo y varios minutos",
    "manual: necesita a una persona operando Calendly de verdad",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
