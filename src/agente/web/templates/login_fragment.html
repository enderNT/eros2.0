{% extends "base.html" %}
{% block title %}Inicio de sesi\u00f3n \u2014 Panel{% endblock %}
{% block body %}
<div class="page">
  <header><h1>Panel</h1></header>
  <div class="card">
    <form method="post" action="/admin/login" hx-post hx-swap="outerHTML">
      <label for="password">Contrase\u00f1a</label>
      <input type="password" id="password" name="password" required autofocus>
      <button type="submit">Entrar</button>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </form>
  </div>
</div>
{% endblock %}
