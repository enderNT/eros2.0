{% from "macros.html" import hint %}
<div class="form-action">
  <label><strong>Interruptor global</strong>
    {{ hint("Apaga el bot por completo: ningún número, ningún contacto recibe respuesta. Es el «parar todo ahora»; los mensajes siguen llegando a la bandeja de Kapso para que los conteste una persona.") }}
  </label>
  <form hx-post="/admin/global" hx-target="closest .form-action" hx-swap="outerHTML"
    data-saved-muted="{{ 'true' if global_muted else 'false' }}" onsubmit="return confirmGlobalChange(this)">
    <label class="toggle-row" for="global-muted">
      <input id="global-muted" name="muted" type="checkbox" value="true"{% if global_muted %} checked{% endif %}
        onchange="revealGlobalSave(this.form)">
      <span>{% if global_muted %}El bot está apagado para todos.{% else %}El bot está activo para todos.{% endif %}</span>
    </label>
    <button class="global-save" type="submit" hidden>Guardar cambio global</button>
  </form>
</div>
