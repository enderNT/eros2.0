{% from "macros.html" import hint %}
<div class="contact-controls">
  {% include "contact_mute_toggle.html" %}
  <div class="form-action">
    <label><strong>Borrar historial</strong>
      {{ hint("Borra todo lo que guardamos de esta persona: mensajes, resumen, perfil, citas registradas y enlaces de agenda. El bot vuelve a tratarla como si escribiera por primera vez. También reactiva el bot si estaba silenciado. No se puede deshacer, y no cancela nada en Calendly ni borra la conversación en Kapso.") }}
    </label>
    {% if purged is defined and purged is not none %}
      <p class="subtle">
        {% if purged %}Listo: {{ purged }} registros borrados.{% else %}No había nada guardado.{% endif %}
      </p>
    {% endif %}
    <form hx-post="/admin/reset" hx-target="closest .contact-controls" hx-swap="outerHTML"
          hx-confirm="Se borra todo el historial de este contacto y el bot vuelve a responderle desde cero. No se puede deshacer. ¿Continuar?">
      <input type="hidden" name="phone_number_id" value="{{ key.phone_number_id }}">
      <input type="hidden" name="contact_phone" value="{{ key.contact_phone }}">
      <button type="submit" class="danger">Borrar historial</button>
    </form>
  </div>
</div>
