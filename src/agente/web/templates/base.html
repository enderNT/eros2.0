<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Panel{% endblock %}</title>
  <link rel="stylesheet" href="/admin/static/style.css">
  <script src="/admin/static/htmx.min.js"></script>
</head>
<body>
<p id="save-error" class="save-error" role="alert" hidden></p>
<div class="page">{% block body %}{% endblock %}</div>
<dialog id="global-change-dialog" class="confirm-dialog">
  <form method="dialog">
    <h2>¿Guardar cambio global?</h2>
    <p>Este cambio afectará el comportamiento del bot para todos los contactos.</p>
    <div class="dialog-actions">
      <button value="cancel" class="secondary">Cancelar</button>
      <button id="confirm-global-change" type="button">Guardar</button>
    </div>
  </form>
</dialog>
<script>
  let pendingGlobalForm = null;
  function revealGlobalSave(form) {
    const save = form.querySelector('.global-save');
    if (!save) return;
    if (form.elements.minutes) {
      save.hidden = Number(form.elements.minutes.value) === Number(form.dataset.savedMinutes);
    } else {
      save.hidden = form.elements.muted.checked === (form.dataset.savedMuted === 'true');
    }
  }
  function openGlobalChange(form) {
    if (!form.reportValidity()) return;
    pendingGlobalForm = form;
    const dialog = document.getElementById('global-change-dialog');
    if (dialog && dialog.showModal) {
      dialog.showModal();
    } else if (window.confirm('¿Guardar cambio global?')) {
      saveGlobalChange(form);
      pendingGlobalForm = null;
    }
  }
  function saveGlobalChange(form) {
    const targetSelector = form.getAttribute('hx-target');
    const target = targetSelector.startsWith('closest ')
      ? form.closest(targetSelector.slice('closest '.length))
      : document.querySelector(targetSelector);
    // If the target ever goes missing htmx falls back to document.body, and an
    // outerHTML swap there wipes the whole page. Stay inside this control.
    htmx.ajax('POST', form.getAttribute('hx-post'), {
      source: form,
      target: target || form.closest('.form-action') || form,
      swap: form.getAttribute('hx-swap')
    });
  }
  document.getElementById('confirm-global-change').addEventListener('click', function () {
    // Close first, unconditionally: a modal that stays open on a click looks
    // frozen and hides whatever went wrong behind it.
    document.getElementById('global-change-dialog').close();
    const form = pendingGlobalForm;
    pendingGlobalForm = null;
    if (form) saveGlobalChange(form);
  });
  function formatReminderMinutes(minutes) {
    if (minutes >= 1440 && minutes % 1440 === 0) {
      const days = minutes / 1440;
      return days + ' día' + (days === 1 ? '' : 's');
    }
    if (minutes >= 60 && minutes % 60 === 0) {
      const hours = minutes / 60;
      return hours + ' hora' + (hours === 1 ? '' : 's');
    }
    return minutes + ' min';
  }
  // A save that dies silently is what made this panel feel broken: the UI just
  // sat there. Any failed request now says so on screen, no DevTools needed.
  function showSaveError(text) {
    const banner = document.getElementById('save-error');
    banner.textContent = text;
    banner.hidden = false;
  }
  document.body.addEventListener('htmx:sendError', function () {
    showSaveError('No se pudo contactar al servidor. ¿Sigue corriendo el contenedor?');
  });
  document.body.addEventListener('htmx:responseError', function (evt) {
    showSaveError('El servidor rechazó el cambio (HTTP ' + (evt.detail.xhr ? evt.detail.xhr.status : '?') + ').');
  });
  document.body.addEventListener('htmx:beforeRequest', function () {
    document.getElementById('save-error').hidden = true;
  });
  function setReminderPreset(button, minutes) {
    const form = button.closest('form');
    const input = form.elements.minutes;
    input.value = minutes;
    document.getElementById('appointment-reminder-value').value = formatReminderMinutes(minutes);
    revealGlobalSave(form);
  }
</script>
</body>
</html>
